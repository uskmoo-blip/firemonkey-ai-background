name: Patch session restore startup

on:
  push:
    paths:
      - .github/workflows/patch-session-restore.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch startup logic
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('ai-chat-background.user.js')
          text = main.read_text(encoding='utf-8')
          text = text.replace('// @version      1.0.1', '// @version      1.1.0', 1)

          old = """  init().catch(showFatalError);
          })();
          """

          new = """  let initPromise = null;

            function cleanupStaleUi() {
              if (state.observer) {
                try { state.observer.disconnect(); } catch (_) {}
                state.observer = null;
              }

              [
                `${APP_ID}-style`,
                `${APP_ID}-layer`,
                `${APP_ID}-shade`,
                `${APP_ID}-edit-layer`,
                `${APP_ID}-edit-hint`,
                `${APP_ID}-edit-done`,
                ROOT_ID,
                `${APP_ID}-panel`,
                `${APP_ID}-error`
              ].forEach((id) => document.getElementById(id)?.remove());
            }

            function start(reason = 'initial') {
              if (!document.body || !document.documentElement) return Promise.resolve(false);

              if (document.getElementById(ROOT_ID)) {
                try {
                  applyVisualState();
                  scheduleDomRefresh();
                } catch (_) {}
                return Promise.resolve(true);
              }

              if (initPromise) return initPromise;

              cleanupStaleUi();
              initPromise = init()
                .then(() => {
                  log(`再起動確認: ${reason}`);
                  return true;
                })
                .catch((error) => {
                  showFatalError(error);
                  return false;
                })
                .finally(() => {
                  initPromise = null;
                });

              return initPromise;
            }

            function scheduleStart(reason = 'retry') {
              const run = () => {
                if (!document.body || !document.documentElement) return false;
                window.setTimeout(() => start(reason), 0);
                return true;
              };

              if (run()) return;

              const onReady = () => {
                if (!run()) return;
                document.removeEventListener('readystatechange', onReady);
                document.removeEventListener('DOMContentLoaded', onReady);
              };

              document.addEventListener('readystatechange', onReady);
              document.addEventListener('DOMContentLoaded', onReady);
              window.setTimeout(onReady, 0);
            }

            scheduleStart('initial');

            window.addEventListener('pageshow', () => {
              scheduleStart('pageshow');
            }, true);

            document.addEventListener('visibilitychange', () => {
              if (!document.hidden) scheduleStart('visible');
            }, true);

            window.setInterval(() => {
              if (!document.hidden && !document.getElementById(ROOT_ID)) {
                scheduleStart('watchdog');
              }
            }, 1500);
          })();
          """

          if old not in text:
              raise SystemExit('startup block not found')

          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          installer = Path('install.user.js')
          installer.write_text("""// ==UserScript==
          // @name         AI Chat Background Unified (Android)
          // @namespace    yk.local.ai.chat.background
          // @version      1.1.0
          // @description  ChatGPT / Gemini共通。Firefoxのセッション復元にも対応した背景カスタマイズ統合版です。
          // @match        https://chatgpt.com/*
          // @match        https://gemini.google.com/*
          // @run-at       document-start
          // @noframes
          // @grant        GM.info
          // @require      https://raw.githubusercontent.com/uskmoo-blip/firemonkey-ai-background/main/ai-chat-background.user.js?v=1.1.0
          // @updateURL    https://raw.githubusercontent.com/uskmoo-blip/firemonkey-ai-background/main/install.user.js
          // @downloadURL  https://raw.githubusercontent.com/uskmoo-blip/firemonkey-ai-background/main/install.user.js
          // @homepageURL  https://github.com/uskmoo-blip/firemonkey-ai-background
          // ==/UserScript==

          // 本体は @require で読み込みます。
          """, encoding='utf-8')
          PY

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-chat-background.user.js install.user.js
          git diff --cached --quiet || git commit -m "Fix startup after Firefox session restore"
          git push
