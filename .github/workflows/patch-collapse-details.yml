name: Collapse advanced settings

on:
  push:
    paths:
      - .github/workflows/patch-collapse-details.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fold low-frequency controls
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('ai-chat-background.user.js')
          text = main.read_text(encoding='utf-8')
          text = text.replace('// @version      1.1.0', '// @version      1.2.0', 1)

          old_css = """      #${APP_ID}-ranges {
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, .16);
          }
          """

          new_css = """      #${APP_ID}-advanced {
            margin-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, .16);
          }

          #${APP_ID}-advanced > summary {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 46px;
            padding: 0 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .10);
            color: #fff;
            cursor: pointer;
            list-style: none;
            font: 700 15px system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
          }

          #${APP_ID}-advanced > summary::-webkit-details-marker {
            display: none;
          }

          #${APP_ID}-advanced > summary::after {
            content: '▼';
            margin-left: 10px;
            font-size: 12px;
            opacity: .78;
            transition: transform .16s ease;
          }

          #${APP_ID}-advanced[open] > summary::after {
            transform: rotate(180deg);
          }

          #${APP_ID}-advanced-body {
            padding-top: 8px;
          }

          #${APP_ID}-ranges {
            padding-top: 0;
            border-top: 0;
          }
          """

          old_build = """    ui.ranges = createElement('section', { id: `${APP_ID}-ranges` });
            const siteName = SITE === 'chatgpt' ? 'ChatGPT' : 'Gemini';
          """

          new_build = """    ui.advanced = createElement('details', { id: `${APP_ID}-advanced` });
            ui.advancedSummary = createElement('summary', {}, '詳細設定');
            ui.advancedBody = createElement('div', { id: `${APP_ID}-advanced-body` });

            ui.ranges = createElement('section', { id: `${APP_ID}-ranges` });
            const siteName = SITE === 'chatgpt' ? 'ChatGPT' : 'Gemini';
          """

          old_append = """    ui.panel.append(topRow, editRow, ui.status, favorites, ui.ranges, bottomRow);
          """

          new_append = """    ui.advancedBody.append(ui.ranges, bottomRow);
            ui.advanced.append(ui.advancedSummary, ui.advancedBody);
            ui.panel.append(topRow, editRow, ui.status, favorites, ui.advanced);
          """

          for label, old in [('CSS block', old_css), ('range construction', old_build), ('panel append', old_append)]:
              if old not in text:
                  raise SystemExit(f'{label} not found')

          text = text.replace(old_css, new_css, 1)
          text = text.replace(old_build, new_build, 1)
          text = text.replace(old_append, new_append, 1)
          main.write_text(text, encoding='utf-8')

          installer = Path('install.user.js')
          installer.write_text("""// ==UserScript==
          // @name         AI Chat Background Unified (Android)
          // @namespace    yk.local.ai.chat.background
          // @version      1.2.0
          // @description  ChatGPT / Gemini共通。低頻度の表示調整を折り畳める背景カスタマイズ統合版です。
          // @match        https://chatgpt.com/*
          // @match        https://gemini.google.com/*
          // @run-at       document-start
          // @noframes
          // @grant        GM.info
          // @require      https://raw.githubusercontent.com/uskmoo-blip/firemonkey-ai-background/main/ai-chat-background.user.js?v=1.2.0
          // @updateURL    https://raw.githubusercontent.com/uskmoo-blip/firemonkey-ai-background/main/install.user.js
          // @downloadURL  https://raw.githubusercontent.com/uskmoo-blip/firemonkey-ai-background/main/install.user.js
          // @homepageURL  https://github.com/uskmoo-blip/firemonkey-ai-background
          // ==/UserScript==

          // 本体は @require で読み込みます。
          """, encoding='utf-8')
          PY

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-chat-background.user.js install.user.js
          git diff --cached --quiet || git commit -m "Collapse advanced display settings"
          git push
